<!doctype html>
<html> 
 <head> 
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
  </style> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.3.3/html2canvas.min.js"></script> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="Tax Invoice.css"></script> 
 <style type="text/css" id="dcoder_stylesheet">body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  h1 {
    background-color: #4CAF50;
    color: white;
    padding: 10px;
    text-align: center;
  }
  form {
    margin: 15px;
  }
  label { 
    display: inline-block;
    width: 150px;
    text-align: right;
    margin-right: 10px;
  }
  input[type="text"], input[type="number"] {
    width: 200px;
    padding: 5px;
    margin-bottom: 10px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }
  th {
    background-color: #4CAF50;
    color: white;
    padding: 10px;
  }
  button {
    background-color: #4CAF50;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover {
    background-color: #3e8e41;
  }
  #totalAmountWithGstInWords {
    font-weight: bold;            
    font-size: 1.2em;
    margin-left: 20px;
  }</style></head> 
 <body> 
  <h1>Tax Invoice</h1>
  <div style="display:flex; justify-content:space-between; align-items:center; margin: 0 20px 10px 20px;">
    <div id="customerBlock" style="display:flex; align-items:center; gap:10px;">
      <label for="customerName" style="margin:0; font-weight:normal;">Customer Name:</label>
      <input type="text" id="customerName" name="customerName">
      <label for="counterNo" style="margin:0; font-weight:normal;">Counter No:</label>
      <select id="counterNo" name="counterNo">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
    <div id="invoiceTimestamp" style="text-align:right; font-size:0.95em; color:#333;">
      <!-- Live date/time will appear here -->
    </div>
  </div>
  <form>
  <table id="bill"> 
   <tbody> 
    <tr> 
    <th>Item Name</th> 
    <th>Quantity</th> 
    <th>Rate</th> 
    <th>Amount</th> 
    <th></th> 
    </tr> 
    <tr> 
    <td><input type="text" name="itemName[]"></td> 
    <td><input type="number" name="quantity[]" oninput="calculateAmount(this)"></td> 
    <td><input type="number" name="rate[]" oninput="calculateAmount(this)"></td> 
    <td><input type="number" name="amount[]" readonly></td> 
    <td></td> 
    </tr> 
   </tbody> 
  </table> <button type="button" onclick="addRow()">Add Item</button> 
   <br> 
   <br> 
   <table> 
    <tbody> 
     <tr> 
      <th>Total Amount:</th> 
      <td><input type="number" id="totalAmount" name="totalAmount" readonly></td>
     </tr> 
     <tr>
      <th>GST Rate (%):</th>
      <td><input type="number" id="gstRate" name="gstRate" value="18" min="0" step="0.01" oninput="calculateTotal()"></td>
     </tr>
     <tr>
      <th>GST Amount:</th>
      <td><input type="number" id="gstAmount" name="gstAmount" readonly></td>
     </tr>
     <tr> 
      <th>Total Amount with GST:</th> 
      <td><input type="number" id="totalAmountWithGst" name="totalAmountWithGst" readonly></td> 
     </tr> 
     <tr>
      <th>Discount (%):</th>
      <td><input type="number" id="discountRate" name="discountRate" value="0" min="0" step="0.01" oninput="calculateTotal()"></td>
     </tr>
     <tr>
      <th>Discount Amount:</th>
      <td><input type="number" id="discountAmount" name="discountAmount" readonly></td>
     </tr>
     <tr>
      <th>Grand Total:</th>
      <td><input type="number" id="grandTotal" name="grandTotal" readonly></td>
     </tr>
     <tr> 
      <th>Shop Name:</th> 
      <td>Shreyash Wholesale Dealers</td> 
     </tr> 
    </tbody> 
   </table> 
   <br> 
   <br> <button type="button" onclick="generateImage()">Download as Image</button> 
   <button type="button" onclick="generatePDF()">Download as PDF</button> 
   <button type="button" onclick="newBill()">New</button> 
  <button type="button" onclick="sendToEmail()">Send To Email</button>
  <div style="display: flex; justify-content: flex-end; margin-top: 30px;">
    <button type="button" id="completePaymentBtn" onclick="addPaymentCompleteLine()" style="background-color: #2196F3; color: white; min-width: 180px; font-weight: bold;">Complete Payment</button>
  </div>
  <div id="paymentCompleteLine" style="display:none; margin-top: 30px; text-align: center; font-size: 1.2em; font-weight: bold; color: #388e3c;">Payment Completed and Verified!!</div>
  </form> 
  <script>
        function sendToEmail() {
          // Generate PDF first
          generatePDF();
          // Get customer name for subject
          var rawName = document.getElementById('customerName') ? document.getElementById('customerName').value : '';
          var name = (rawName || '').toString().trim();
          if (!name) name = 'bill';
          name = name.replace(/[^a-z0-9 \-_]/gi, '');
          name = name.replace(/\s+/g, '_');
          var subject = encodeURIComponent('Invoice from Shreyash Wholesale Dealers for ' + name);
          var body = encodeURIComponent('Please find attached the invoice PDF.\n\n(If not attached, please click the Download as PDF button and attach the file manually.)');
          var gmailUrl = 'https://mail.google.com/mail/?view=cm&fs=1&su=' + subject + '&body=' + body;
          window.open(gmailUrl, '_blank');
          alert('PDF generated and Gmail compose window opened. Please attach the downloaded PDF to the email.');
        }
    function calculateAmount(input) {
      var row = input.parentNode.parentNode;
      var quantity = row.cells[1].getElementsByTagName("input")[0].value;
      var rate = row.cells[2].getElementsByTagName("input")[0].value;
      var amount = row.cells[3].getElementsByTagName("input")[0];
      amount.value = (quantity * rate).toFixed(2); // Round to 2 decimal places
      calculateTotal();
    }

    function addRow() {
      var table = document.querySelector("#bill");
      var row = table.insertRow(-1);
      var cell1 = row.insertCell(0);
      var cell2 = row.insertCell(1);
      var cell3 = row.insertCell(2);
      var cell4 = row.insertCell(3);
      var cell5 = row.insertCell(4);
      cell1.innerHTML = "<input type='text' name='itemName[]'>";
      cell2.innerHTML = "<input type='number' name='quantity[]' oninput='calculateAmount(this)'>";
      cell3.innerHTML = "<input type='number' name='rate[]' oninput='calculateAmount(this)'>";
      cell4.innerHTML = "<input type='number' name='amount[]' readonly>";
      cell5.innerHTML = "<button type='button' onclick='removeRow(this)'>Remove Item</button>";
    }

    function removeRow(button) {
      var row = button.parentNode.parentNode;
      row.parentNode.removeChild(row);
      calculateTotal();
    }

    function calculateTotal() {
      var amounts = document.getElementsByName("amount[]");
      var total = 0;
      for (var i = 0; i < amounts.length; i++) {
        var val = parseFloat(amounts[i].value);
        if (!isNaN(val)) total += val;
      }

      // Read GST rate (percentage) from input, default to 18 if invalid
      var gstRateInput = parseFloat(document.getElementById("gstRate").value);
      var gstPercent = !isNaN(gstRateInput) ? gstRateInput : 18;
      var gstDecimal = gstPercent / 100;
      var gstAmount = total * gstDecimal;

      document.getElementById("totalAmount").value = total.toFixed(2); // Round to 2 decimal places
      document.getElementById("gstAmount").value = gstAmount.toFixed(2); // Round to 2 decimal places
      document.getElementById("totalAmountWithGst").value = (total + gstAmount).toFixed(2); // Round to 2 decimal places

      // If discount fields exist, calculate discount and grand total
      var discountRateInput = document.getElementById("discountRate");
      var discountAmountInput = document.getElementById("discountAmount");
      var grandTotalInput = document.getElementById("grandTotal");
      if (discountRateInput && discountAmountInput && grandTotalInput) {
        var discountRate = parseFloat(discountRateInput.value) || 0;
        var discountAmount = (total + gstAmount) * (discountRate / 100);
        discountAmountInput.value = discountAmount.toFixed(2); // Round to 2 decimal places
        grandTotalInput.value = ((total + gstAmount) - discountAmount).toFixed(2); // Round to 2 decimal places
      }
    }

    // Helper: zero-pad numbers
    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    // Format and update the invoice timestamp (dd/mm/yyyy and hh:mm:ss)
    function updateTimestamp() {
      var el = document.getElementById('invoiceTimestamp');
      if (!el) return;
      var now = new Date();
      var date = pad2(now.getDate()) + '/' + pad2(now.getMonth() + 1) + '/' + now.getFullYear();
      var time = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
      el.textContent = date + '  ' + time;
    }

    // Start live updater (updates every second)
    try { updateTimestamp(); } catch (e) { }
    var __invoiceTimestampInterval = setInterval(function() { try { updateTimestamp(); } catch (e) {} }, 1000);

    function generateImage() {
      // Ensure totals are up-to-date before capturing
      try { calculateTotal(); } catch (e) { /* ignore if not available */ }

      // Get customer name and create a safe filename
      var rawName = document.getElementById('customerName') ? document.getElementById('customerName').value : '';
      var name = (rawName || '').toString().trim();
      if (!name) {
        name = 'bill';
      }
      // Remove characters that are unsafe for filenames, keep letters, numbers, spaces, -, _
      name = name.replace(/[^a-z0-9 \-_]/gi, '');
      // Replace spaces with underscores
      name = name.replace(/\s+/g, '_');

      // Hide buttons for snapshot, but do not visually affect the user
      var buttons = Array.prototype.slice.call(document.querySelectorAll('button'));
      var hiddenButtons = [];
      buttons.forEach(function(b) {
        var prev = b.style.display;
        hiddenButtons.push(prev);
        b.setAttribute('data-prev-display', prev);
        b.style.display = 'none';
      });

      html2canvas(document.body).then(function(canvas) {
        // A4 size in pixels at 96 DPI: 794 x 1123
        var a4WidthPx = Math.round(210 * 96 / 25.4); // ~794
        var a4HeightPx = Math.round(297 * 96 / 25.4); // ~1123
        var a4Canvas = document.createElement('canvas');
        a4Canvas.width = a4WidthPx;
        a4Canvas.height = a4HeightPx;
        var ctx = a4Canvas.getContext('2d');
        // Fill white background
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, a4WidthPx, a4HeightPx);
        // Draw the invoice at the top, not stretched, centered horizontally if needed
        var scale = Math.min(a4WidthPx / canvas.width, 1); // Only shrink if too wide
        var drawWidth = Math.round(canvas.width * scale);
        var drawHeight = Math.round(canvas.height * scale);
        var x = Math.floor((a4WidthPx - drawWidth) / 2);
        ctx.drawImage(canvas, x, 0, drawWidth, drawHeight);
        var image = a4Canvas.toDataURL("image/png");
        var link = document.createElement("a");
        link.href = image;
        link.download = name + '.png';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Restore button display
        buttons.forEach(function(b, i) {
          b.style.display = b.getAttribute('data-prev-display') || '';
          b.removeAttribute('data-prev-display');
        });
      }).catch(function(err) {
        // Restore on error too
        buttons.forEach(function(b, i) {
          b.style.display = b.getAttribute('data-prev-display') || '';
          b.removeAttribute('data-prev-display');
        });
        console.error(err);
      });
    }

    function generatePDF() {
      // Ensure totals are up-to-date before capturing
      try { calculateTotal(); } catch (e) { /* ignore if not available */ }

      // Get customer name and create a safe filename
      var rawName = document.getElementById('customerName') ? document.getElementById('customerName').value : '';
      var name = (rawName || '').toString().trim();
      if (!name) {
        name = 'bill';
      }
      // Remove characters that are unsafe for filenames, keep letters, numbers, spaces, -, _
      name = name.replace(/[^a-z0-9 \-_]/gi, '');
      // Replace spaces with underscores
      name = name.replace(/\s+/g, '_');

      // Hide buttons for snapshot, but do not visually affect the user
      var buttons = Array.prototype.slice.call(document.querySelectorAll('button'));
      var hiddenButtons = [];
      buttons.forEach(function(b) {
        var prev = b.style.display;
        hiddenButtons.push(prev);
        b.setAttribute('data-prev-display', prev);
        b.style.display = 'none';
      });

      html2canvas(document.body).then(function(canvas) {
        // A4 size in pixels at 96 DPI: 794 x 1123
        var a4WidthPx = Math.round(210 * 96 / 25.4); // ~794
        var a4HeightPx = Math.round(297 * 96 / 25.4); // ~1123
        var a4Canvas = document.createElement('canvas');
        a4Canvas.width = a4WidthPx;
        a4Canvas.height = a4HeightPx;
        var ctx = a4Canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, a4WidthPx, a4HeightPx);
        // Draw the invoice at the top, not stretched, centered horizontally if needed
        var scale = Math.min(a4WidthPx / canvas.width, 1); // Only shrink if too wide
        var drawWidth = Math.round(canvas.width * scale);
        var drawHeight = Math.round(canvas.height * scale);
        var x = Math.floor((a4WidthPx - drawWidth) / 2);
        ctx.drawImage(canvas, x, 0, drawWidth, drawHeight);
        var imgData = a4Canvas.toDataURL('image/png');
        var pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        var imgWidth = 210;
        // Calculate height in mm for the drawn invoice (preserving aspect ratio)
        var pxPerMm = a4WidthPx / 210;
        var imgHeight = drawHeight / pxPerMm;
        pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);

        var pdfBlob = pdf.output('blob');
        var pdfUrl = URL.createObjectURL(pdfBlob);
        var link = document.createElement('a');
        link.href = pdfUrl;
        link.download = name + '.pdf';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(function() { URL.revokeObjectURL(pdfUrl); document.body.removeChild(link); }, 100);

        // Restore button display
        buttons.forEach(function(b, i) {
          b.style.display = b.getAttribute('data-prev-display') || '';
          b.removeAttribute('data-prev-display');
        });
      }).catch(function(err) {
        // Restore on error too
        buttons.forEach(function(b, i) {
          b.style.display = b.getAttribute('data-prev-display') || '';
          b.removeAttribute('data-prev-display');
        });
        console.error(err);
      });
    }
    function addPaymentCompleteLine() {
      var line = document.getElementById('paymentCompleteLine');
      if (line) line.style.display = 'block';
      var btn = document.getElementById('completePaymentBtn');
      if (btn) btn.style.display = 'none';
    }

    function newBill() {
      location.reload();
    }
  </script> 
  </script> 
</body>
